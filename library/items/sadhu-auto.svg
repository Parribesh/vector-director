<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800">
  <!-- Front-view auto-rickshaw with a driver and a kid peeking out of the side.
       Character space: centre x=300, ground y=730. States: wave = the kid waves. -->
  <style>
    @keyframes kid-wave { from { transform: rotate(48deg); } to { transform: rotate(88deg); } }
    .kid-arm { transform-box: fill-box; transform-origin: 100% 50%; transition: transform .3s; }
    [data-state~="wave"] .kid-arm { animation: kid-wave .32s ease-in-out infinite alternate; }
    @keyframes auto-idle { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(1.5px); } }
    .auto-body { animation: auto-idle .12s linear infinite; }
  </style>
  <ellipse cx="300" cy="728" rx="160" ry="13" fill="#000" opacity=".2"/>
  <g class="auto-body" stroke="#1F2430" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
    <ellipse cx="300" cy="702" rx="24" ry="28" fill="#22252E"/>
    <!-- cabin -->
    <rect x="164" y="460" width="272" height="232" rx="18" fill="#2E8B57"/>
    <rect x="168" y="470" width="34" height="170" rx="8" fill="#1E2A23"/>
    <rect x="398" y="470" width="34" height="170" rx="8" fill="#1E2A23"/>
    <!-- driver behind the windshield -->
    <rect x="248" y="440" width="104" height="40" rx="16" fill="#C8B27A"/>
    <circle cx="300" cy="414" r="27" fill="#B9774A"/>
    <path d="M 274,404 Q 278,382 300,382 Q 322,382 326,404 Q 312,394 300,396 Q 288,394 274,404 Z" fill="#1A1A1A"/>
    <path d="M 286,424 Q 300,418 314,424" fill="none" stroke-width="4"/>
    <circle cx="291" cy="410" r="2.5" fill="#1F2430"/><circle cx="309" cy="410" r="2.5" fill="#1F2430"/>
    <rect x="200" y="364" width="200" height="104" rx="12" fill="#CFE8F5" opacity=".55"/>
    <line x1="206" y1="472" x2="394" y2="472" stroke="#111" stroke-width="8"/>
    <!-- canopy -->
    <path d="M 156,470 L 156,362 Q 166,312 300,302 Q 434,312 444,362 L 444,470 Z" fill="none" stroke-width="5"/>
    <path d="M 156,362 Q 166,312 300,302 Q 434,312 444,362 L 444,372 L 156,372 Z" fill="#F5C542"/>
    <rect x="152" y="452" width="296" height="18" rx="6" fill="#1F1F1F"/>
    <!-- front cowl -->
    <path d="M 214,560 Q 300,540 386,560 L 370,700 Q 300,712 230,700 Z" fill="#33A365"/>
    <circle cx="300" cy="596" r="17" fill="#FFF6C8"/>
    <circle cx="300" cy="596" r="7" fill="#FFFFFF" stroke="none"/>
    <rect x="262" y="640" width="76" height="22" rx="3" fill="#F5C542" stroke-width="2.5"/>
    <text x="300" y="656" text-anchor="middle" font-family="Helvetica, Arial" font-weight="700" font-size="13" fill="#1F2430" stroke="none">DL 1R 7788</text>
    <circle cx="232" cy="574" r="6" fill="#FFB020" stroke-width="2"/>
    <circle cx="368" cy="574" r="6" fill="#FFB020" stroke-width="2"/>
    <!-- kid peeking out of the left side -->
    <rect x="150" y="520" width="44" height="60" rx="12" fill="#8FC8F2"/>
    <circle cx="170" cy="498" r="22" fill="#C68A5E"/>
    <path d="M 148,494 Q 150,472 170,472 Q 192,472 192,494 Q 180,484 170,486 Q 158,484 148,494 Z" fill="#151515"/>
    <circle cx="163" cy="500" r="2.6" fill="#1F2430" stroke="none"/><circle cx="178" cy="500" r="2.6" fill="#1F2430" stroke="none"/>
    <path d="M 162,508 Q 170,516 178,508" fill="none" stroke-width="3"/>
    <g class="kid-arm">
      <line x1="118" y1="536" x2="156" y2="536" stroke-width="16"/>
      <line x1="118" y1="536" x2="156" y2="536" stroke="#C68A5E" stroke-width="9"/>
      <circle cx="114" cy="536" r="9" fill="#C68A5E" stroke-width="3"/>
    </g>
  </g>
</svg>
