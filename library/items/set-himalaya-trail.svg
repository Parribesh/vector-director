<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800">
<defs>
  <linearGradient id="tr-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6FB6E6"/><stop offset=".65" stop-color="#BFE3F6"/><stop offset="1" stop-color="#E9F6FB"/></linearGradient>
  <radialGradient id="tr-sun"><stop offset="0" stop-color="#FFFBEA"/><stop offset=".3" stop-color="#FFF6D0" stop-opacity=".7"/><stop offset="1" stop-color="#FFF6D0" stop-opacity="0"/></radialGradient>
  <g id="tr-pine"><rect x="-4" y="-18" width="8" height="18" fill="#5A3E2B"/><path d="M -26,-14 L 0,-58 L 26,-14 Z M -22,-38 L 0,-78 L 22,-38 Z M -16,-60 L 0,-96 L 16,-60 Z" fill="#3E6B48" stroke="#2C4A33" stroke-width="3" stroke-linejoin="round"/></g>
  <g id="tr-cloud"><circle cx="0" cy="0" r="34"/><circle cx="38" cy="-14" r="42"/><circle cx="82" cy="2" r="32"/><circle cx="40" cy="14" r="30"/><rect x="0" y="0" width="84" height="32" rx="16"/></g>
</defs>
<style>
  @keyframes flutter { 0% { transform: skewX(-8deg) scaleX(.92); } 100% { transform: skewX(9deg) scaleX(1.02); } }
  .flag { transform-box: fill-box; transform-origin: 50% 0; animation: flutter 1.1s ease-in-out infinite alternate; }
  @keyframes tr-cloud { from { transform: translateX(1450px); } to { transform: translateX(-450px); } }
  .cloud { animation: tr-cloud linear infinite; }
  @keyframes tr-snow { from { transform: translate(0, -40px); } to { transform: translate(-60px, 860px); } }
  .snow { animation: tr-snow linear infinite; }
  @keyframes tr-sway { from { transform: rotate(-6deg); } to { transform: rotate(6deg); } }
  .grass { transform-box: fill-box; transform-origin: 50% 100%; animation: tr-sway 2.2s ease-in-out infinite alternate; }
  @keyframes tr-fly { from { transform: translate(1350px, 0); } to { transform: translate(-200px, -40px); } }
  @keyframes tr-flap { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(-.5); } }
  .bird { transform-box: fill-box; transform-origin: center; animation: tr-flap .6s ease-in-out infinite; }
</style>
