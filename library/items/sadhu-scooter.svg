<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800">
  <!-- Front-view delivery scooter, drawn in character space (centre x=300, ground y=730).
       The rider sits ~95 units lower than standing, so attach with dy=-95.
       States (data-state on the parent): rev = engine shake, broken = smoke, lights = headlight glow. -->
  <style>
    .sc-smoke, .sc-beam { display: none; }
    [data-state~="broken"] .sc-smoke { display: inline; }
    [data-state~="lights"] .sc-beam { display: inline; }
    @keyframes sc-shake { 0% { transform: translate(0, 0); } 25% { transform: translate(1.5px, -1px); } 50% { transform: translate(-1.5px, 1px); } 75% { transform: translate(1px, 1px); } }
    [data-state~="rev"] .sc-body { animation: sc-shake .07s linear infinite; }
    @keyframes sc-puff { 0% { transform: translate(0, 0) scale(.5); opacity: 0; } 15% { opacity: .9; } 100% { transform: translate(-30px, -160px) scale(1.8); opacity: 0; } }
    .sc-puff { transform-box: fill-box; transform-origin: center; animation: sc-puff 2.4s ease-out infinite; }
    [data-state~="broken"] .sc-body { transform: rotate(-4deg); transform-box: fill-box; transform-origin: 50% 100%; }
  </style>
  <ellipse cx="300" cy="728" rx="96" ry="12" fill="#000" opacity=".2"/>
  <g class="sc-body" stroke="#1F2430" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
    <ellipse cx="300" cy="704" rx="22" ry="26" fill="#22252E"/>
    <ellipse cx="300" cy="704" rx="8" ry="12" fill="#5A5E68" stroke-width="2"/>
    <path d="M 270,692 Q 270,666 300,662 Q 330,666 330,692 Z" fill="#178A82"/>
    <!-- leg shield -->
    <path d="M 228,566 Q 300,550 372,566 L 352,690 Q 300,700 248,690 Z" fill="#1FA39A"/>
    <path d="M 246,580 Q 300,568 354,580 L 340,680 Q 300,688 260,680 Z" fill="#26B8AE" stroke="none"/>
    <path d="M 270,600 L 300,640 L 330,600" fill="none" stroke="#E8EEF2" stroke-width="5"/>
    <rect x="270" y="648" width="60" height="20" rx="3" fill="#FFFFFF" stroke-width="2.5"/>
    <text x="300" y="663" text-anchor="middle" font-family="Helvetica, Arial" font-weight="700" font-size="12" fill="#1F2430" stroke="none">DL 3S 4021</text>
    <!-- handlebar, cowl, headlight, mirrors -->
    <path d="M 238,522 L 218,474" fill="none" stroke-width="4"/>
    <path d="M 362,522 L 382,474" fill="none" stroke-width="4"/>
    <ellipse cx="214" cy="468" rx="15" ry="11" fill="#9FD7F2"/>
    <ellipse cx="386" cy="468" rx="15" ry="11" fill="#9FD7F2"/>
    <line x1="198" y1="532" x2="402" y2="532" stroke="#2B2B2B" stroke-width="10"/>
    <line x1="196" y1="532" x2="222" y2="532" stroke="#111" stroke-width="14"/>
    <line x1="378" y1="532" x2="404" y2="532" stroke="#111" stroke-width="14"/>
    <path d="M 236,520 Q 300,500 364,520 L 358,554 Q 300,564 242,554 Z" fill="#1FA39A"/>
    <circle cx="300" cy="536" r="15" fill="#FFF6C8"/>
    <circle cx="300" cy="536" r="7" fill="#FFFFFF" stroke="none"/>
    <circle cx="250" cy="530" r="5" fill="#FFB020" stroke-width="2"/>
    <circle cx="350" cy="530" r="5" fill="#FFB020" stroke-width="2"/>
  </g>
  <g class="sc-smoke">
    <circle class="sc-puff" cx="318" cy="520" r="30" fill="#6F6F6F"/>
    <circle class="sc-puff" style="animation-delay:-.5s" cx="340" cy="530" r="24" fill="#858585"/>
    <circle class="sc-puff" style="animation-delay:-1s" cx="300" cy="526" r="27" fill="#5E5E5E"/>
    <circle class="sc-puff" style="animation-delay:-1.5s" cx="330" cy="516" r="22" fill="#7A7A7A"/>
    <circle class="sc-puff" style="animation-delay:-2s" cx="310" cy="530" r="26" fill="#696969"/>
  </g>
  <circle class="sc-beam" cx="300" cy="536" r="70" fill="#FFF6C8" opacity=".45"/>
</svg>
