<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800">
<defs>
  <linearGradient id="cv-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F29C7A"/><stop offset=".45" stop-color="#F8C189"/><stop offset="1" stop-color="#FFE7BD"/></linearGradient>
  <radialGradient id="cv-sun"><stop offset="0" stop-color="#FFF6DC"/><stop offset=".3" stop-color="#FFE3A6" stop-opacity=".8"/><stop offset="1" stop-color="#FFE3A6" stop-opacity="0"/></radialGradient>
  <radialGradient id="cv-cave" cx=".5" cy=".75" r=".7"><stop offset="0" stop-color="#7A4524"/><stop offset=".55" stop-color="#3D2618"/><stop offset="1" stop-color="#22160F"/></radialGradient>
  <radialGradient id="cv-fire"><stop offset="0" stop-color="#FFB347" stop-opacity=".55"/><stop offset="1" stop-color="#FFB347" stop-opacity="0"/></radialGradient>
  <pattern id="cv-check" width="16" height="16" patternUnits="userSpaceOnUse"><rect width="16" height="16" fill="#F3E3C3"/><rect width="8" height="8" fill="#5A3E2B"/><rect x="8" y="8" width="8" height="8" fill="#5A3E2B"/></pattern>
</defs>
<style>
  @keyframes flutter { 0% { transform: skewX(-8deg) scaleX(.92); } 100% { transform: skewX(9deg) scaleX(1.02); } }
  .flag { transform-box: fill-box; transform-origin: 50% 0; animation: flutter 1.1s ease-in-out infinite alternate; }
  @keyframes cv-spin { to { transform: rotate(360deg); } }
  .rays { transform-box: fill-box; transform-origin: center; animation: cv-spin 120s linear infinite; }
  @keyframes cv-sea { from { transform: translateX(0); } to { transform: translateX(-80px); } }
  .sea { animation: cv-sea 18s ease-in-out infinite alternate; }
  @keyframes cv-flicker { 0% { transform: scale(1, 1) skewX(0); } 33% { transform: scale(.94, 1.1) skewX(4deg); } 66% { transform: scale(1.04, .92) skewX(-3deg); } 100% { transform: scale(1, 1) skewX(0); } }
  .flame { transform-box: fill-box; transform-origin: 50% 100%; animation: cv-flicker .5s ease-in-out infinite; }
  @keyframes cv-glow { 0%, 100% { opacity: .85; } 50% { opacity: 1; } }
  .fireglow { animation: cv-glow 1.3s ease-in-out infinite; }
  @keyframes cv-spark { 0% { transform: translate(0, 0); opacity: 1; } 100% { transform: translate(var(--dx), -170px); opacity: 0; } }
  .spark { animation: cv-spark linear infinite; }
  @keyframes cv-smoke { 0% { transform: translate(0, 0) scale(.6); opacity: 0; } 25% { opacity: .35; } 100% { transform: translate(30px, -220px) scale(1.6); opacity: 0; } }
  .smoke { transform-box: fill-box; transform-origin: center; animation: cv-smoke 5s ease-out infinite; }
  @keyframes cv-swing { from { transform: rotate(-5deg); } to { transform: rotate(5deg); } }
  .bell { transform-box: fill-box; transform-origin: 50% 0; animation: cv-swing 2.6s ease-in-out infinite alternate; }
  @keyframes cv-steam { 0% { transform: translateY(0); opacity: 0; } 30% { opacity: .8; } 100% { transform: translateY(-46px); opacity: 0; } }
  .steam { animation: cv-steam 2.6s ease-out infinite; }
  @keyframes cv-fly { from { transform: translate(1350px, 0); } to { transform: translate(500px, -60px); } }
  @keyframes cv-flap { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(-.5); } }
  .bird { transform-box: fill-box; transform-origin: center; animation: cv-flap .6s ease-in-out infinite; }
</style>
