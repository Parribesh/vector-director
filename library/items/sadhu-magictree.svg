<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800">
  <!-- The magic seed. Character space: centre x=300, ground y=730.
       States: (none) = a dirt mound, glow = the mound shines, sprout = a little shoot,
       grow = a full mango tree rises with golden fruit. Combine them: "glow grow". -->
  <defs>
    <radialGradient id="mt-gold"><stop offset="0" stop-color="color-mix(in srgb,var(--c2,#a39c99) 59.8%,white)" stop-opacity=".9"/><stop offset="1" stop-color="color-mix(in srgb,var(--c2,#a39c99) 59.8%,white)" stop-opacity="0"/></radialGradient>
    <radialGradient id="mt-aura"><stop offset="0" stop-color="color-mix(in srgb,var(--c2,#a49d99) 45.1%,white)" stop-opacity=".75"/><stop offset=".5" stop-color="color-mix(in srgb,var(--c2,#a29d99) 76.5%,white)" stop-opacity=".25"/><stop offset="1" stop-color="color-mix(in srgb,var(--c2,#a29d99) 76.5%,white)" stop-opacity="0"/></radialGradient>
  </defs>
  <style>
    .mt-aura, .mt-sparks { opacity: 0; transition: opacity 1.5s; }
    [data-state~="glow"] .mt-aura, [data-state~="glow"] .mt-sparks { opacity: 1; }
    @keyframes mt-pulse { from { transform: scale(.9); } to { transform: scale(1.1); } }
    .mt-aura { transform-box: fill-box; transform-origin: 50% 100%; animation: mt-pulse 1.6s ease-in-out infinite alternate; }
    @keyframes mt-tw { 0%, 100% { opacity: 0; transform: scale(.3) rotate(0); } 50% { opacity: 1; transform: scale(1) rotate(45deg); } }
    .mt-spark { transform-box: fill-box; transform-origin: center; animation: mt-tw 2s ease-in-out infinite; }
    .mt-sprout { transform-box: fill-box; transform-origin: 50% 100%; transform: scale(0); transition: transform 1.4s cubic-bezier(.3,1.6,.5,1); }
    [data-state~="sprout"] .mt-sprout { transform: scale(1); }
    [data-state~="grow"] .mt-sprout { transform: scale(0); transition-duration: .6s; }
    .mt-tree { transform-box: fill-box; transform-origin: 50% 100%; transform: scale(.02); opacity: 0; transition: transform 6s cubic-bezier(.25,.9,.3,1.05), opacity .6s; }
    [data-state~="grow"] .mt-tree { transform: scale(1); opacity: 1; }
    @keyframes mt-sway { from { transform: rotate(-1.5deg); } to { transform: rotate(1.5deg); } }
    .mt-crown { transform-box: fill-box; transform-origin: 50% 100%; animation: mt-sway 3.6s ease-in-out infinite alternate; }
    @keyframes mt-mango { from { opacity: .75; } to { opacity: 1; } }
    .mt-mango { animation: mt-mango .8s ease-in-out infinite alternate; }
  </style>
  <ellipse class="mt-aura" cx="300" cy="560" rx="260" ry="300" fill="url(#mt-aura)"/>
  <g class="mt-tree" stroke-linejoin="round" stroke-linecap="round">
