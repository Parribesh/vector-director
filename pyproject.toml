[project]
name = "vector-director"
version = "0.0.1"
description = "Prompt-to-animated-SVG studio, built one AI technique at a time."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
]

# Each milestone pulls in only its own heavy dependencies:
#   uv pip install -e ".[m1]"
[project.optional-dependencies]
m1 = ["playwright>=1.45", "open_clip_torch>=2.24", "torch>=2.3", "pillow>=10", "anthropic>=0.40", "instructor>=1.4"]
m2 = ["lancedb>=0.13", "rank-bm25>=0.2", "open_clip_torch>=2.24", "sentence-transformers>=3.0"]
m3 = ["torch>=2.3", "tokenizers>=0.19", "matplotlib>=3.8"]
m4 = ["torch>=2.3", "open_clip_torch>=2.24"]
m5 = ["transformers>=4.44", "peft>=0.12", "datasets>=2.20", "accelerate>=0.33", "bitsandbytes>=0.43"]
m6 = ["trl>=0.11", "transformers>=4.44", "peft>=0.12"]
m7 = ["langgraph>=0.2", "librosa>=0.10", "mido>=1.3", "tree-sitter>=0.23"]
m8 = ["fastapi>=0.112", "sse-starlette>=2.1", "outlines>=0.1", "modal>=0.64", "vllm>=0.6"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
vd = "vector_director.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vector_director"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
